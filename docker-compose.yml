services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      EHRLICH_DATABASE_URL: ${EHRLICH_DATABASE_URL}
      EHRLICH_ANTHROPIC_API_KEY: ${EHRLICH_ANTHROPIC_API_KEY}
      EHRLICH_WORKOS_CLIENT_ID: ${EHRLICH_WORKOS_CLIENT_ID:-}
      EHRLICH_WORKOS_API_KEY: ${EHRLICH_WORKOS_API_KEY:-}
      EHRLICH_CORS_ORIGINS: ${EHRLICH_CORS_ORIGINS}
      EHRLICH_ENVIRONMENT: ${EHRLICH_ENVIRONMENT:-production}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
